search_tools:
  - search_tool_name: "unionlab-tavily"
    litellm_params:
      search_provider: "tavily"
      api_key: os.environ/TAVILY_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  hide_default_credentials_hint: true
  store_model_in_db: true
  store_prompts_in_spend_logs: true

environment_variables:
  UI_LOGO_PATH: https://unionlab-static.oss-cn-hangzhou.aliyuncs.com/public/llm/union-ai.png
  LITELLM_FAVICON_URL: https://unionlab-static.oss-cn-hangzhou.aliyuncs.com/public/llm/union-ai.png

router_settings:
  max_fallbacks: 3
  fallbacks:
    # 百炼主 → Azure 备
    - deepseek-v4-pro: [deepseek-v4-pro-azure-fallback]
    - deepseek-v4-flash: [deepseek-v4-flash-azure-fallback]
    # Azure 主 → OpenAI 备
    - gpt-5.4: [gpt-5.4-openai-fallback]
    - gpt-5.4-mini: [gpt-5.4-mini-openai-fallback]
    - gpt-5.4-nano: [gpt-5.4-nano-openai-fallback]
    - gpt-5-mini: [gpt-5-mini-openai-fallback]
    - gpt-5-nano: [gpt-5-nano-openai-fallback]
    - gpt-4o: [gpt-4o-openai-fallback]
    - gpt-4o-mini: [gpt-4o-mini-openai-fallback]
    - text-embedding-3-large: [text-embedding-3-large-openai-fallback]
    - text-embedding-3-small: [text-embedding-3-small-openai-fallback]

litellm_settings:
  drop_params: true
  set_verbose: false
  callbacks: ["websearch_interception"]
  websearch_interception_params:
    enabled_providers: ["azure_ai"]
    search_tool_name: "unionlab-tavily"
  ui_theme_config:
    logo_url: https://unionlab-static.oss-cn-hangzhou.aliyuncs.com/public/llm/union-ai.png
    favicon_url: https://unionlab-static.oss-cn-hangzhou.aliyuncs.com/public/llm/union-ai.png
    hide_upstream_ui_extras: true
