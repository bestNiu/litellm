# 使用官方预构建镜像快速部署
# 用法: docker compose up -d
#
# 官方镜像不含 UnionLab 二开 UI。必须先准备 custom-ui（./ensure-ui.sh 或 ./build-ui.sh），
# 再 `up -d` 重建容器。不要用 `docker compose restart`。

services:
  unionlab-gateway:
    image: ghcr.io/berriai/litellm-database:v1.89.2
    container_name: unionlab-gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./custom-ui:/var/lib/litellm/ui:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      STORE_MODEL_IN_DB: "True"
      STORE_PROMPTS_IN_SPEND_LOGS: "True"
      LITELLM_UI_PATH: /var/lib/litellm/ui
      # 关闭对外暴露的 API 文档（Swagger "/"、ReDoc "/redoc"、OpenAPI "/openapi.json"）
      NO_DOCS: "True"
      NO_REDOC: "True"
      NO_OPENAPI: "True"
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "4"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
