# 从源码全新构建部署（使用外部 RDS，不启动本地 Postgres）
# 用法: docker compose -f docker-compose.build.yml up -d --build

services:
  unionlab-gateway:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.database
      target: runtime
    image: unionlab-gateway:local
    container_name: unionlab-gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./custom-ui:/app/litellm/proxy/_experimental/out:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      STORE_MODEL_IN_DB: "True"
      STORE_PROMPTS_IN_SPEND_LOGS: "True"
      LITELLM_UI_PATH: /app/litellm/proxy/_experimental/out
      # 关闭对外暴露的 API 文档（Swagger "/"、ReDoc "/redoc"、OpenAPI "/openapi.json"）
      NO_DOCS: "True"
      NO_REDOC: "True"
      NO_OPENAPI: "True"
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "4"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
